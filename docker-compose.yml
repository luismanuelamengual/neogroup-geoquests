services:
  postgres:
    image: postgres:16-alpine
    container_name: geoquests-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geoquests
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - geoquests-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d geoquests']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  geoquests-postgres-data:
